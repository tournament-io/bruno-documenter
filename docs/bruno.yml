opencollection: 1.0.0
info:
  name: Tournament.app Public API
config:
  environments:
    - name: Base Environment
      variables: []
    - name: Live
      variables:
        - name: url
          value: https://api.tournament.io/v1/public
        - name: apiToken
          value: <YOUR_API_TOKEN>
        - name: tournamentId
          value: tio:4AHchFkVAecs2
items:
  - info:
      name: API
      type: folder
      seq: 2
    items:
      - info:
          name: Courts - Tables
          type: folder
          seq: 4
        docs:
          content: In Tournament.app, "courts" refer to the designated playing areas for matches. For table soccer (foosball) tournaments, courts are equivalent to tables. Each court represents a single foosball table where matches are played.
          type: text/markdown
        items:
          - info:
              name: /tournaments/:id/courts/:courtId
              type: http
              seq: 4
            http:
              method: GET
              url: '{{url}}/tournaments/:id/courts/:courtId'
              headers:
                - name: Authorization
                  value: '{{apiToken}}'
              params:
                - name: includeMatchDetails
                  value: 'true'
                  type: query
                - name: id
                  value: '{{tournamentId}}'
                  type: path
                - name: courtId
                  value: tio:XBZxd1GA3Kog9
                  type: path
            settings:
              encodeUrl: true
              timeout: 0
              followRedirects: true
              maxRedirects: 5
            docs: |-
              This endpoint retrieves a single court.

              <aside class="notice">
              A court object includes the `currentMatchId` of the currently assigned match, if a match is assigned and announced.
              </aside>


              ```response:200
              {
                "id": "tio:dLUOkXt5oHEvq",
                "number": 2,
                "name": "2",
                "currentMatchId": "tio:dWT5oSbv2kYQg"
              }
              ```

              ```response:200
              // with includeMatchDetails=true
              {
                "id": "tio:dLUOkXt5oHEvq",
                "number": 2,
                "name": "2",
                "currentMatchId": "tio:dWT5oSbv2kYQg",
                "currentMatch": {
                  "id": "tio:dWT5oSbv2kYQg",
                  "entries": [
                    {
                      "id": "05-2553_05-4357",
                      "name": "Helmut Poppen / Sophia Poppen"
                    },
                    {
                      "id": "05-9012_05-9876",
                      "name": "Caroline Conrad / Andrei Andros"
                    }
                  ],
                  "state": "running",
                  "encounters": [],
                  "startTime": "2024-07-03T14:39:16.575Z"
                }
              }
              ```
          - info:
              name: /tournaments/:id/courts
              type: http
              seq: 3
            http:
              method: GET
              url: '{{url}}/tournaments/:id/courts'
              headers:
                - name: Authorization
                  value: '{{apiToken}}'
              params:
                - name: includeMatchDetails
                  value: 'true'
                  type: query
                - name: id
                  value: '{{tournamentId}}'
                  type: path
            settings:
              encodeUrl: true
              timeout: 0
              followRedirects: true
              maxRedirects: 5
            docs: |-
              This endpoint retrieves a list of courts associated with a specific tournament.

              <aside class="notice">
              A court object includes the `currentMatchId` of the currently assigned match, if a match is assigned and announced. Add the query parameter `includeMatchDetails=true` to include the full match.
              </aside>


              ```response:200
              [
                {
                  "id": "tio:XBZxd1GA3Kog9",
                  "number": 1,
                  "name": "1"
                },
                {
                  "id": "tio:dLUOkXt5oHEvq",
                  "number": 2,
                  "name": "2",
                  "currentMatchId": "tio:dWT5oSbv2kYQg"
                },
                {
                  "id": "tio:5k35E1vfm3IwG",
                  "number": 3,
                  "name": "3"
                },
                ...
              ]
              ```

              ```response:200
              // with includeMatchDetails=true
              [
                {
                  "id": "tio:XBZxd1GA3Kog9",
                  "number": 1,
                  "name": "1"
                },
                {
                  "id": "tio:dLUOkXt5oHEvq",
                  "number": 2,
                  "name": "2",
                  "currentMatchId": "tio:dWT5oSbv2kYQg",
                  "currentMatch": {
                    "id": "tio:dWT5oSbv2kYQg",
                    "entries": [
                      {
                        "id": "05-2553_05-4357",
                        "name": "Helmut Poppen / Sophia Poppen"
                      },
                      {
                        "id": "05-9012_05-9876",
                        "name": "Caroline Conrad / Andrei Andros"
                      }
                    ],
                    "state": "running",
                    "encounters": [],
                    "disciplineName": "[D1] Discipline 1",
                    "roundName": "Round 1",
                    "groupName": "Qualification"
                    "startTime": "2024-07-03T14:39:16.575Z"
                  }
                },
                {
                  "id": "tio:5k35E1vfm3IwG",
                  "number": 3,
                  "name": "3"
                },
                ...
              ]

              ```
