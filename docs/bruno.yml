            settings:
              encodeUrl: true
              timeout: 0
              followRedirects: true
              maxRedirects: 5
            docs: |-
              This endpoint allows you to retrieve the current standings for a specific group within a tournament.

              ### Response Structure

              The response returns an array of standing entries, each representing a participant's statistics and ranking within the group. It is always sorted to match the position in the standings.

              <aside class="warning">
              Each standing entry always includes the `id` and `entry` fields. All other fields (such as points, matches played, goals, etc.) are only included in the response if they are configured to be shown in the standings table for that particular tournament.
              </aside>

              ### Possible fields

              | Property | Type | Description |
              |----------|------|-------------|
              | `matches` | number | Total number of matches played |
              | `points` | number | Total points earned |
              | `pointsPerMatch` | number | Average points earned per match |
              | `correctedPointsPerMatch` | number | Adjusted average points per match (used in MonsterDYP) |
              | `hasCorrectedValue` | boolean | Indicates if the points per match have been adjusted |
              | `matchesWon` | number | Number of matches won |
              | `matchesLost` | number | Number of matches lost |
              | `matchesDraw` | number | Number of matches drawn |
              | `matchesDiff` | number | Difference between matches won and lost |
              | `setsWon` | number | Number of sets won |
              | `setsLost` | number | Number of sets lost |
              | `setsDiff` | number | Difference between sets won and lost |
              | `encounterWon` | number | Number of encounters won |
              | `encounterLost` | number | Number of encounters lost |
              | `encounterDraw` | number | Number of encounters drawn |
              | `encounterDiff` | number | Difference between encounters won and lost |
              | `goals` | number | Total goals scored |
              | `goalsIn` | number | Total goals conceded |
              | `goalsDiff` | number | Difference between goals scored and conceded |
              | `bh1` | number | First Buchholz score |
              | `bh2` | number | Second Buchholz score |
              | `sb` | number | Sonneborn-Berger score |
              | `opponents` | Record<string, number> | Record of opponents faced and their corresponding values |
              | `lives` | number | Number of lives remaining (used in "Last One Standing" tournaments) |
              | `rank` | number | Position in the standings table (-1 if not ranked) |
              | `result` | number | Entry's position in the standings table (always order + 1, -1 if not set) |
              | `prelimResult` | number | Entry's position before the current stage (-1 if not applicable) |
              | `lastRound` | number | The last round the entry participated in (-1 if not set) |
              | `firstRound` | number | The first round the entry participated in (-1 if not set) |
              | `finalResult` | boolean | Indicates if this is the final result for the entry |

              ```response:200
              [
                {
                  "id": "tio:N2qVwj1OZyQXK_05-2929_05-3555",
                  "entry": {
                    "id": "05-9012_05-9876",
                    "name": "Caroline Conrad / Andrei Andros"
                  },
                  "matches": 2,
                  "bh1": 0.75,
                  "points": 2
                },
                {
                  "id": "tio:N2qVwj1OZyQXK_05-2553_05-4357",
                  "entry": {
                    "id": "05-2553_05-4357",
                    "name": "Helmut Poppen / Sophia Poppen"
                  },
                  "matches": 2,
                  "bh1": 1,
                  "points": 0
                },
                ...

              ]
              ```
      - info:
          name: Tournaments
          type: folder
          seq: 2
        items:
          - info:
              name: /tournaments/:id
              type: http
              seq: 4
            http:
              method: GET
              url: '{{url}}/tournaments/:id'
              headers:
                - name: Authorization
                  value: '{{apiToken}}'
              params:
                - name: id
                  value: '{{tournamentId}}'
                  type: path
            settings:
              encodeUrl: true
              timeout: 0
              followRedirects: true
              maxRedirects: 5
            docs: |-
              Get a single tournament.

              ### Tournament Structure

              The tournament object is structured hierarchically to accommodate various competition formats and complexities. Here's a breakdown of its main components:

              #### Disciplines

              Disciplines represent different categories or events within a tournament. Examples include:

              - Open Singles
              - Open Doubles
              - Men's Doubles
              - Women's Singles
              - ...

              #### EntryType

              The `entryType` defines what type of participants are playing in a discipline. 

              | EntryType | Description |
              |-----------|-------------|
              | `single` | Represents individual participants. Each entry is a single player competing on their own. |
              | `team_name` | Represents named teams. Entries are teams with specific names. No players are assigned. |
              | `dyp` | Stands for "Draw Your Partner". In this format, players are paired before the tournament starts. During the tournament, the teams are fixed. |
              | `byp` | Stands for "Bring Your Partner". Players enter the tournament with a chosen partner, forming a fixed team throughout the event. |
              | `monster_dyp` | Individual players participate and are assigned to new teams every round. |


              #### Stages

              Stages represent distinct phases of a tournament within a discipline. Common stages include:

              - Preliminary Round
              - Elimination Round

              #### Valid states

              | StageState | Description |
              |------------|-------------|
              | `planned` | The stage is set up but not yet ready to begin. It may still be in the configuration or preparation phase. |
              | `ready` | The stage is fully configured and ready to start. All necessary preparations are complete, but matches haven't begun. |
              | `running` | The stage is currently active. Matches are being played or are scheduled to be played in this stage. |
              | `finished` | All matches in the stage have been completed. The stage is no longer active and its results are final. |

              #### Groups

              Groups are the fundamental units of competition within a stage. Every stage has at least one group, but can have multiple depending on the tournament format:

              - In a round-robin format (like the soccer World Cup), a stage might have multiple groups where teams play against others in their group.
              - In elimination formats, multiple groups can represent different elimination trees

              Groups define the tournament mode, such as Swiss system, round-robin, or single elimination. They contain the matches and standings for that part of the competition. The states are the same as the states in the stage.

              Currently following tournament modes are implemented:
              - `double_elimination`
              - `elimination`
              - `last_one_standing`
              - `lord_have_mercy`
              - `monster_dyp`
              - `round_robin`
              - `rounds`
              - `snake_draw`
              - `swiss`
              - `dutch_system`
              - `whist`

              #### Group Options

              Group options define specific settings and rules for how matches are conducted within a group:

              ##### Match Configurations
              Match configurations set the rules for how games are played and scored. 

              | Option | Description |
              |--------|-------------|
              | `name` | The name of the match configuration (e.g., "Encounter 1", "Team 1 vs Team 1", "Single") is chosen by the Tournament Admin and should only be displayed if more than one configuration is set up. |
              | `draw` | Boolean indicating whether matches can end in a draw |
              | `numPoints` | Number of points needed to win a set |
              | `numSets` | Number of won sets needed to win the match |
              | `twoAhead` | Boolean indicating whether a player must win by two points |
              | `quickEntry` | Boolean enabling simplified score entry mode, in this case scores a either 1 or 0 |

              ##### Additional Settings

              Some tournament modes have specific options:

              | Option | Description |
              |--------|-------------|
              | `eliminationThirdPlace` | Boolean indicating whether a third-place match will be played in elimination formats |


              ```response:200
              {
                "id": "tio:T5MMiW8IVuWMp",
                "name": "SaDo",
                "description": "",
                "startTime": "2024-04-27T14:20:00.772Z",
                "endTime": "2024-04-27T14:20:00.772Z",
                "state": "running",
                "disciplines": [
                  {
                    "id": "tio:I8QZl6uRnsvta",
                    "name": "Discipline 1",
                    "shortName": "D1",
                    "entryType": "byp",
                    "stages": [
                      {
                        "id": "tio:zDbCy8RMvgoBF",
                        "state": "running",
                        "groups": [
                          {
                            "id": "tio:N2qVwj1OZyQXK",
                            "name": "COMMON-QUALIFICATION",
                            "tournamentMode": "swiss",
                            "state": "running",
                            "options": {
                              "eliminationThirdPlace": false,
                              "matchConfigurations": [
                                {
                                  "name": "Encounter 1",
                                  "draw": false,
                                  "numPoints": 7,
                                  "numSets": 1,
                                  "twoAhead": false,
                                  "quickEntry": false
                                }
                              ]
                            }
                          }
                        ]
                      }
                    ]
                  }
                ]
              }

              ```
