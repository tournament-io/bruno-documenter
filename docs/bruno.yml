  - info:
      name: Webhooks
      type: folder
      seq: 3
    docs:
      content: |-
        Webhooks offer a powerful way to receive real-time updates from Tournament.app about specific events in your tournaments. Instead of constantly polling our API for changes, webhooks allow our system to push information to your application as events occur.

        To use this feature, you must provide a POST endpoint in your application that we can call when specific changes happen in the tournament.
      type: text/markdown
    items:
      - info:
          name: Create Webhooks
          type: http
          seq: 4
        http:
          method: INFO
          url: No URL, Just Documentation
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          To use the API and set up webhooks, you'll need to generate an API token and configure your webhook endpoints. Follow these steps:

          1. Log in to your Tournament.app account
          2. Click on your profile picture in the bottom left corner
          3. Navigate to "Settings"
          4. Select the "API" section
          5. Click on "Create Webhook"
      - info:
          name: Error Handling
          type: http
          seq: 6
        http:
          method: INFO
          url: No URL, Just Documentation
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Tournament.app implements a robust error handling and retry mechanism for webhook deliveries:

          ### Retry Mechanism

          - If your webhook endpoint responds with a non-2xx status code, Tournament.app considers it a failed delivery.
          - The system will attempt to resend the events up to 5 times.
          - Each retry follows an exponential backoff strategy, increasing the time between attempts.

          ### Webhook Disabling

          - After 5 consecutive failed attempts, the webhook will be automatically disabled.
          - This prevents unnecessary network traffic and reduces system load.

          ### Re-enabling a Disabled Webhook

          To re-enable a disabled webhook:

          1. Navigate to the webhook list in your Tournament.app settings.
          2. Locate the disabled webhook (it will be marked as such).
          3. Click the play button next to the disabled webhook to re-enable it.

          ### Debugging

          The webhook list in Tournament.app provides access to log messages for each webhook. These logs are available for debugging purposes can hopepfully assist in identifying and resolving issues with your webhook endpoint.
      - info:
          name: Webhook Events
          type: http
          seq: 5
        http:
          method: INFO
          url: No URL, Just Documentation
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Each webhook call is structured as a `WebhookCallDto`, containing a unique, incrementing ID, the tournament ID, and an array of events.

          ### Webhook Synchronization

          Tournament.app supports offline functionality, which can affect webhook event delivery:

          - When devices are offline, changes are stored locally.
          - Upon reconnection, all accumulated changes are synced to the server.
          - These synced changes are then sent as events to your webhook endpoint.
          - Each event includes a `createdAt` timestamp, reflecting when the change was made on the user's device.

          This approach ensures that no updates are lost, even during periods of disconnection. However, be aware that you may receive multiple events simultaneously when a device comes back online after an extended offline period.

          ### Webhook Call Structure

          Each webhook call will have this structure:

          ```json
          {
            "id": 1234,
            "tournamentId": "tio:T5MMiW8IVuWMp",
            "events": [
              {
                "type": "MatchUpdated",
                "matchId": "tio:uVOK5NQ5ruqqm",
                "createdAt": "2024-08-28T15:12:30.413Z"
              },
              {
                "type": "StandingsUpdated",
                "createdAt": "2024-08-28T15:12:30.413Z"
              },
              {
                "type": "CourtMatchChanged",
                "courtId": "tio:xfelozmkJVomE",
                "createdAt": "2024-08-28T15:12:30.413Z"
              }
            ]
          }
          ```

          ### Event Types

          #### CourtMatchChanged
          Triggered when a court gets a new match or a match is removed from a court.
          Example:
          ```json
          {
            "type": "CourtMatchChanged",
            "courtId": "tio:XBZxd1GA3Kog9",
            "matchId": "tio:80qYlVngRdUjx",
            "createdAt": "2024-08-27T17:06:23.051Z"
          }
          ```

          #### MatchUpdated
          Triggered when a match is updated (e.g., score update, player change).
          Example:
          ```json
          {
            "type": "MatchUpdated",
            "matchId": "tio:80qYlVngRdUjx",
            "createdAt": "2024-08-27T17:06:23.051Z"
          }
          ```

          #### TournamentUpdated
          Triggered when tournament state or options are changed.
          Example:
          ```json
          {
            "type": "TournamentUpdated",
            "createdAt": "2024-08-27T17:06:23.051Z"
          }
          ```

          #### TournamentAdded
          Triggered when a new tournament is added.
          Example:
          ```json
          {
            "type": "TournamentAdded",
            "createdAt": "2024-08-27T17:06:23.051Z"
          }
          ```


          #### EntryListUpdated
          Triggered when:
          - An entry is added
          - An Entry is removed
          - An Entry is edited

          Example:
          ```json
          {
            "type": "EntryListUpdated",
            "createdAt": "2024-08-27T17:06:23.051Z"
          }
          ```

          #### StandingsUpdated
          Triggered when the standings of the tournament where updated

          Example:
          ```json
          {
            "type": "StandingsUpdated",
            "createdAt": "2024-08-27T17:06:23.051Z"
          }
          ```
docs:
  content: |-
    <aside class="warning">
    The document and the API is still work in progress. It only works with Version 3 of Kickertool.
    </aside>


    Welcome to the Tournament.app Public API documentation. This API allows you to access tournament data from our platform, enabling you to integrate Tournament.app functionality into your own applications or services.

    ## Introduction

    The Tournament.app Public API provides programmatic access to tournament information, including tournament details, courts, and matches. This API is designed for end-users who want to retrieve data from tournaments they have created or have access to on the Tournament.app platform.

    ### Supported Apps
    Currently this API is only supported by the Kickertool V3 Alpha: [https://alpha.kickertool.de](https://alpha.kickertool.de)

    ### Authentication

    To use the API, you'll need to generate an API token. Follow these steps to obtain your token:

    1. Log in to your Tournament.app account
    2. Click on your profile picture in the bottom left corner
    3. Navigate to "Settings"
    4. Select the "API" section
    5. Generate your API token

    Once you have your token, include it in the header of each API request for authentication.

    ### Base URL

    All API requests should be made to:

    ```
    https://api.tournament.io/v1/public
    ```
  type: text/markdown
bundled: true
