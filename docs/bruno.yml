          - info:
              name: /tournaments/:id/matches/:matchId/live-result
              type: http
              seq: 14
            http:
              method: PUT
              url: '{{url}}/tournaments/:id/matches/:matchId/live-result'
              headers:
                - name: Content-Type
                  value: application/json
                - name: Authorization
                  value: '{{apiToken}}'
              params:
                - name: id
                  value: '{{tournamentId}}'
                  type: path
                - name: matchId
                  value: tio:hHXxHHqBfkyUh
                  type: path
              body:
                type: json
                data: |-
                  {
                    "result": [[[0, 0]]]
                  }
            settings:
              encodeUrl: true
              timeout: 0
              followRedirects: true
              maxRedirects: 5
            docs: |-
              This endpoint lets you update the live score of a match in a tournament. It works like `PUT /result`, but it does not end the match. Use the `PUT /live-result` endpoint to send in-progress scores. When the match is over, send the final score with `PUT /result`.

              <aside class="warning">
              Only matches in the state `running` can be updated. If the match has a different state, a 412 status is returned.
              </aside>

              ### Body
              See  `PUT /result`
          - info:
              name: /tournaments/:id/matches/:matchId/result
              type: http
              seq: 13
            http:
              method: PUT
              url: '{{url}}/tournaments/:id/matches/:matchId/result'
              headers:
                - name: Content-Type
                  value: application/json
                - name: Authorization
                  value: '{{apiToken}}'
              params:
                - name: id
                  value: '{{tournamentId}}'
                  type: path
                - name: matchId
                  value: tio:1xjhBzTcCKe5a
                  type: path
              body:
                type: json
                data: |-
                  {
                    "result": [[[1, 7]]]
                  }
            settings:
              encodeUrl: true
              timeout: 0
              followRedirects: true
              maxRedirects: 5
            docs: |-
              This endpoint allows you to set the result of a running match within a tournament.

              <aside class="warning">
              Only matches in the state `running` can be updated. If the match has a different state, a 412 status is returned.
              </aside>

              ### Body
              The request body should contain a \`result\` field with the new match result:

              ```json
              {
                "result": [[[1, 7]]]
              }
              ```

              The `result` field follows the structure of the `encounters` array described in the match details:

              1. Outermost array: Encounters (for league modes like Single/Double/Single)
              2. Middle array: Sets within each encounter
              3. Innermost array: Actual scores for each set

              On successful update (status code 200), the response will contain the updated match object. This object follows the same structure as described in the Get Match Details endpoint.


              ```response:200
              {
                "id": "tio:dWT5oSbv2kYQg",
                "entries": [
                  {
                    "id": "05-2553_05-4357",
                    "name": "Helmut Poppen / Sophia Poppen"
                  },
                  {
                    "id": "05-9012_05-9876",
                    "name": "Caroline Conrad / Andrei Andros"
                  }
                ],
                "state": "played",
                "encounters": [
                  [
                    [
                      1,
                      7
                    ]
                  ]
                ],
                "displayScore": [
                  1,
                  7
                ],
                "startTime": "2024-07-03T14:39:16.575Z",
                "endTime": "2024-08-09T18:09:36.210Z",
                
                "isLiveResult": false,
                "disciplineId": "tio:JHriFxv2ZBCYD",
                "disciplineName": "[D1] Discipline 1",
                "roundId": "tio:S0U825dvJ8v5a",
                "roundName": "Round 1",
                "groupId": "tio:bEC14gDhxf5pT",
                "groupName": "Qualification"
              }
              ```

              ```response:412
              {
                "message": "Match is not running",
                "error": "Precondition Failed",
                "statusCode": 412
              }
              ```
          - info:
              name: /tournaments/:id/matches/:matchId
              type: http
              seq: 8
            http:
              method: GET
              url: '{{url}}/tournaments/:id/matches/:matchId'
              headers:
                - name: Authorization
                  value: '{{apiToken}}'
              params:
                - name: id
                  value: '{{tournamentId}}'
                  type: path
                - name: matchId
                  value: tio:jl4V1KG3Djl4u
                  type: path
            settings:
              encodeUrl: true
              timeout: 0
              followRedirects: true
              maxRedirects: 5
            docs: |-
              This endpoint allows you to retrieve detailed information about a specific match within a tournament. This endpoint is useful for getting up-to-date data on match status, scores, and participating players or teams. 

              ### entries
              The structure of the entries field can vary depending on the type of tournament running.

              <aside class="warning">
              All teams or players can be `null`. For example, if a team in an elimination round has not yet been assigned, it will be indicated as `null`.
              </aside>


              #### Singles Tournament
              For a Singles tournament it would appear as follows:
              ```json
              "entries": [
                {
                  "id": "05-2553",
                  "name": "Helmut Poppen",
                  "entries": [
                    {
                      "id": "05-2553",
                      "name": "Helmut Poppen"
                    }
                  ]
                },
                {
                  "id": "11-2482",
                  "name": "Isabel Wagner",
                  "entries": [
                    {
                      "id": "11-2482",
                      "name": "Isabel Wagner"
                    }
                  ]
                }
              ],
              ```

              #### Fixed Teams tournament
              For a structiure for a fixed team tournament looks quite similar:
              ```json
              "entries": [
              {
                  "id": "05-2553_05-4357",
                  "name": "Helmut Poppen / Sophia Poppen",
                  "entries": [
                    {
                      "id": "05-2553",
                      "name": "Helmut Poppen"
                    },
                    {
                      "id": "05-4357",
                      "name": "Sophia Poppen"
                    }
                  ]
                },
                {
                  "id": "05-9012_05-9876",
                  "name": "Caroline Conrad / Andrei Andros",
                  "entries": [
                    {
                      "id": "05-9876",
                      "name": "Caroline Conrad"
                    },
                    {
                      "id": "05-9012",
                      "name": "Andrei Andros"
                    }
                  ]
                }
              ],
              ```


              #### Variable Teams Tournament
              For a MonsterDYP or Last One Standing tournament, the players of a team are wrapped in an seperate array:

              ```json
              "entries": [
                [
                  {
                    "id": "05-2553",
                    "name": "Helmut Poppen",
                    "entries": [
                      {
                        "id": "05-2553",
                        "name": "Helmut Poppen"
                      }
                    ]
                  },
                  {
                    "id": "05-4357",
                    "name": "Sophia Poppen",
                    "entries": [
                      {
                        "id": "05-4357",
                        "name": "Sophia Poppen"
                      }
                    ]
                  }
                ],
                [
                  {
                    "id": "05-9012",
                    "name": "Caroline Conrad",
                    "entries": [
                      {
                        "id": "05-9012",
                        "name": "Caroline Conrad"
                      }
                    ]
                    
                  },
                  {
                    "id": "05-9876",
                    "name": "Andrei Andros",
                    "entries": [
                      {
                        "id": "05-9876",
                        "name": "Andrei Andros"
                      }
                    ]
                  }
                ],
              ],
              ```
              <aside class="notice">
              There are tournament modes that support more than 2 players per team.
              </aside>
              <aside class="warning">
              The team may be set to `null`, and there are even cases where a single player in a team is set to `null`. This occurs when the "Lord Have Mercy" system is enabled during an elimination.
              </aside>

              ### Valid `state` values:
               - `open`: Match is waiting to be announced
               - `paused`: Match is disabled (on pause)
               - `skipped`: Match is skipped (e.g. Entry left tournament)
               - `running`: Match is running
               - `played`: Match is finished / played
               - `planned`: Match is planned / awaiting announcement
               - `incomplete`: Match is waiting for entries to be assigned
               - `bye`: Match is a bye (e.g. in elimination stage)

              ### encounters / score
              The encounters array stores the detailed result of the match. It consists of 3 nested arrays:

              ```
              1) Encounters: For league modes like Single/Double/Single every entry represents an encounter
                 2) Sets: This is an array of winning sets
                    3) Score: The actual result of an match is stored here
              ```

              <aside class="notice">
                If a result is set, there will be a `displayScore` property that contains the calculated score.
              </aside>

              Simple Example: just one set
              ```json
              "encounters": [
                [
                  [7, 5]
                ]
              ],
              "displayScore": [7, 5],
              ```

              More complex: Best of 3
              ```json
              "encounters": [
                [
                  [7, 5],
                  [6, 7],
                  [2, 7]
                ]
              ],
              "displayScore": [1, 3]
              ```

              Max. Complexity: 3 Encounters - Best of 3, Best of one, Best of 5
              ```json
              "encounters": [
                [
                  [7, 5],
                  [6, 7],
                  [2, 7]
                ],
                  [2, 7]
                ],
                  [
                  [6, 7],
                  [7, 5],
                  [2, 7],
                  [7, 5],
                  [2, 7],
                ],
              ],
              "displayScore": [0, 3]
              ```
              <aside class="notice">
                If "Quick Entry" for results is selected, scores are represented as `1` or `0`.
              </aside>





              ```response:200
              // Running Match
              {
                "id": "tio:dWT5oSbv2kYQg",
                "entries": [
                  {
                    "id": "05-2553_05-4357",
                    "name": "Helmut Poppen / Sophia Poppen"
                  },
                  {
                    "id": "05-9012_05-9876",
                    "name": "Caroline Conrad / Andrei Andros"
                  }
                ],
                "state": "running",
                "encounters": [],
                "isLiveResult": true,
                
                "disciplineId": "tio:JHriFxv2ZBCYD",
                "disciplineName": "[D1] Discipline 1",
                "roundId": "tio:S0U825dvJ8v5a",
                "roundName": "Round 1",
                "groupId": "tio:bEC14gDhxf5pT",
                "groupName": "Qualification",
                
                "startTime": "2024-07-03T14:39:16.575Z"
              }
              ```

              ```response:200
              // Finished Match
              {
                "id": "tio:dWT5oSbv2kYQg",
                "entries": [
                  {
                    "id": "05-2553_05-4357",
                    "name": "Helmut Poppen / Sophia Poppen",
                    "entries": [
                      {
                        "id": "05-2553",
                        "name": "Helmut Poppen"
                      },
                      {
                        "id": "05-4357",
                        "name": "Sophia Poppen"
                      }
                    ]
                  },
                  {
                    "id": "05-9012_05-9876",
                    "name": "Caroline Conrad / Andrei Andros",
                    "entries": [
                      {
                        "id": "05-9876",
                        "name": "Caroline Conrad"
                      },
                      {
                        "id": "05-9012",
                        "name": "Andrei Andros"
                      }
                    ]
                  }
                ],
                "state": "played",
                "encounters": [
                  [
                    [
                      0,
                      1
                    ]
                  ]
                ],
                "displayScore": [
                  0,
                  1
                ],
                
                "disciplineId": "tio:JHriFxv2ZBCYD",
                "disciplineName": "[D1] Discipline 1",
                "roundId": "tio:S0U825dvJ8v5a",
                "roundName": "Round 1",
                "groupId": "tio:bEC14gDhxf5pT",
                "groupName": "Qualification",
                
                "startTime": "2024-07-03T14:39:16.575Z",
                "endTime": "2024-08-09T18:09:36.210Z"
              }
              ```
